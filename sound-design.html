<style>
:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark;background:#0c0d10;color:#eeedf2}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:48px 32px 64px}.back{color:#92909b;text-decoration:none;font-size:12px}h1{font-size:28px;letter-spacing:.07em;font-weight:500;margin:42px 0 30px}.gallery{display:grid;grid-template-columns:1.55fr 1fr;gap:24px;align-items:start}.landscapes{display:grid;gap:28px}.work{min-width:0}.open-work{display:block;width:100%;border:0;padding:0;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}.cover{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}.portrait .cover{aspect-ratio:9/16}.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s,transform .25s}.open-work:hover img{filter:brightness(1.1);transform:scale(1.02)}.play-mark,.center-toggle{display:grid;place-items:center;border-radius:50%;border:1px solid #ffffff70;background:#08090c66;backdrop-filter:blur(8px);color:white;width:54px;height:54px}.play-mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}svg{width:26px;height:26px;fill:currentColor}.work-title{display:block;font-size:13px;line-height:1.5;font-weight:400;margin-top:10px;color:#b8b5c2;overflow-wrap:break-word}button:focus-visible,a:focus-visible{outline:2px solid #aaa4ba;outline-offset:5px}

@media(max-width:600px){main{padding:28px 18px 40px}h1{font-size:23px;margin:32px 0 24px}.gallery{grid-template-columns:1fr;gap:28px}.landscapes{gap:24px}.portrait.work{width:min(100%,300px);justify-self:center}.cover{border-radius:9px}.work-title{font-size:12px}.play-mark,.center-toggle{width:48px;height:48px}dialog{padding:56px 14px 24px}.screen{border-radius:12px}.viewer h2{font-size:16px}.viewer.portrait{width:min(100%,calc(72dvh * 9 / 16))}}
@media(hover:none){.screen .center-toggle{opacity:.7}}@media(prefers-reduced-motion:reduce){dialog[open],.viewer{animation:none}.cover img,.center-toggle{transition:none}.open-work:hover img{transform:none}}
</style>
